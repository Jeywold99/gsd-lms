{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="form-card">
  <span class="eyebrow">Password reset</span>
  <h1 style="margin-top:12px;">Check your inbox.</h1>
  <p class="lead">If that email belongs to an account, a reset link is on its way. Give it a minute (and check spam).</p>
  <div class="form-links"><a href="{% url 'login' %}">← Back to log in</a></div>
</div>
{% endblock %}
