{% extends "base.html" %}
{% block title %}Password reset{% endblock %}
{% block content %}
<div class="form-card">
  <span class="eyebrow">Password reset</span>
  <h1 style="margin-top:12px;">Done.<br><span style="color:var(--orange);">Back to work.</span></h1>
  <p class="lead">Your password is set. Log in and pick up where you left off.</p>
  <a class="btn btn--primary" href="{% url 'login' %}">Log in →</a>
</div>
{% endblock %}
