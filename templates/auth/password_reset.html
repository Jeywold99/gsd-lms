{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="form-card">
  <span class="eyebrow">Password reset</span>
  <h1 style="margin-top:12px;">Locked out?</h1>
  <p class="lead">Enter your account email and we'll send you a reset link.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.email.errors }}
    <p>
      <label for="id_email">Email</label>
      {{ form.email }}
    </p>
    <button type="submit" class="btn btn--primary" style="width:100%;">Send reset link →</button>
  </form>
  <div class="form-links"><a href="{% url 'login' %}">← Back to log in</a></div>
</div>
{% endblock %}
